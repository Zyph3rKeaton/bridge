name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bridge
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci
      DEVICE_PIN: 1234
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Build backend
        run: npm -w apps/backend run build
      - name: DB migrate
        run: npx prisma migrate deploy
        working-directory: apps/backend
      - name: Test backend
        run: npm -w apps/backend test -- --ci
      - name: Build frontend
        run: npm -w apps/frontend run build
      - name: Test frontend
        run: npm -w apps/frontend test -- --ci 