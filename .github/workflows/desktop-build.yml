name: Desktop Builds

on:
  workflow_dispatch:
    inputs:
      sign_and_notarize:
        description: "Require Apple signing/notarization secrets"
        required: true
        type: boolean
        default: false
      create_draft_release:
        description: "Attach the DMG to a draft GitHub Release"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows portable test app
    runs-on: windows-latest
    env:
      DATABASE_URL: file:./../dev.db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci
      DEVICE_PIN: 1234
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm -w apps/electron run build:win
      - uses: actions/upload-artifact@v7
        with:
          name: bridge-scoring-windows-unpacked
          path: apps/electron/dist/win-unpacked/**
          include-hidden-files: true
          if-no-files-found: error

  mac-dmg:
    name: macOS DMG app
    runs-on: macos-latest
    env:
      DATABASE_URL: file:./../dev.db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci
      DEVICE_PIN: 1234
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Select DMG signing mode
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          has_secrets=1
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(printenv "$name")" ]; then
              has_secrets=0
            fi
          done

          if [ "${{ inputs.sign_and_notarize }}" = "true" ]; then
            if [ "$has_secrets" -ne 1 ]; then
              echo "::error::Signed builds require CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID secrets."
              exit 1
            fi
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "label=signed and notarized" >> "$GITHUB_OUTPUT"
          elif [ "$has_secrets" -eq 1 ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "label=signed and notarized" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Apple signing secrets are missing. Building an unsigned DMG for testing."
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "label=unsigned test" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build signed DMG
        if: ${{ steps.signing.outputs.mode == 'signed' }}
        run: npm -w apps/electron run build:dmg
      - name: Build unsigned DMG
        if: ${{ steps.signing.outputs.mode == 'unsigned' }}
        run: npm -w apps/electron run build:dmg:unsigned
      - name: Verify signed and notarized DMG
        if: ${{ steps.signing.outputs.mode == 'signed' }}
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find apps/electron/dist -type d -name '*.app' -print -quit)"
          DMG_PATH="$(find apps/electron/dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found in apps/electron/dist"
            exit 1
          fi
          if [ -z "$DMG_PATH" ]; then
            echo "::error::No .dmg file found in apps/electron/dist"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          spctl --assess --type open --verbose=4 "$DMG_PATH"
      - name: Verify unsigned DMG
        if: ${{ steps.signing.outputs.mode == 'unsigned' }}
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find apps/electron/dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"

          if [ -z "$DMG_PATH" ]; then
            echo "::error::No .dmg file found in apps/electron/dist"
            exit 1
          fi

          hdiutil verify "$DMG_PATH"
      - uses: actions/upload-artifact@v7
        with:
          name: bridge-scoring-macos-${{ steps.signing.outputs.mode }}-dmg
          path: apps/electron/dist/*.dmg
          if-no-files-found: error
      - name: Create draft release with DMG
        if: ${{ inputs.create_draft_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG_PATH="$(find apps/electron/dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          VERSION="$(node -p "require('./apps/electron/package.json').version")"
          MODE="${{ steps.signing.outputs.mode }}"
          LABEL="${{ steps.signing.outputs.label }}"
          TAG="desktop-v${VERSION}-${GITHUB_RUN_NUMBER}-${MODE}"
          gh release create "$TAG" "$DMG_PATH" \
            --draft \
            --title "Bridge Scoring ${VERSION} ${LABEL} DMG" \
            --notes "Bridge Scoring ${LABEL} DMG from workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
