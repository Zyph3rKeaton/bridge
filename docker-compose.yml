version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bridge
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"
    command: sh -c "npx prisma db push && npm run start:dev"
    working_dir: /app/apps/backend
    volumes:
      - ./:/app
      - /app/node_modules

  seed:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    env_file: .env
    depends_on:
      backend:
        condition: service_started
    command: sh -c "npx ts-node prisma/seed.ts"
    working_dir: /app/apps/backend
    profiles: ["seed"]

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    env_file: .env
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"
    working_dir: /app/apps/frontend
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run dev

volumes:
  db_data: 